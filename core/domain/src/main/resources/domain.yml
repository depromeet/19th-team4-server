# core:domain의 DB 설정. 앱은 spring.config.import로 가져온다.
# dev/prod는 비밀값을 저장소에 두지 않고 환경변수로 주입한다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 마이그레이션 스크립트로만 바꾼다
      ddl-auto: validate

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/saju}
    username: ${DB_USERNAME:saju}
    password: ${DB_PASSWORD:saju}
